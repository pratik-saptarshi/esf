name: PR Go gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  go-gate:
    name: Go vet, tests, and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: true
      - name: Run Go vet
        run: go vet ./...
      - name: Run Go tests with the race detector
        run: go test -race ./...
      - name: Check Go formatting
        shell: bash
        run: |
          git ls-files -z '*.go' | xargs -0 -r gofmt -l | tee /tmp/unformatted-go-files
          test ! -s /tmp/unformatted-go-files
